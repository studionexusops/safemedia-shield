name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  worker-typecheck-and-test:
    name: Cloudflare Worker Typecheck & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare_worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: cloudflare_worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  python-unit-tests:
    name: Python Unit & E2E Harness Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unittest suite
        run: python -m unittest discover -s tests -p "test_*.py"
